server.port=8080

# DB1 Configuration (PostgreSQL Mode)
spring.datasource.db1.driver-class-name=org.h2.Driver
spring.datasource.db1.jdbc-url=jdbc:h2:mem:db1;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.db1.username=sa
spring.datasource.db1.password=

# DB2 Configuration (MySQL Mode)
spring.datasource.db2.driver-class-name=org.h2.Driver
spring.datasource.db2.jdbc-url=jdbc:h2:mem:db2;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.db2.username=sa
spring.datasource.db2.password=
