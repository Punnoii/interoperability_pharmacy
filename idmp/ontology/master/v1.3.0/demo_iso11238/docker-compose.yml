services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pgpass
    ports:
      - "5432:5432"
    volumes:
      - ./sql/postgres:/docker-entrypoint-initdb.d

  ontop:
    image: ontop/ontop:5.3.1
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/idmp-entry.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/iso11238_pg.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/regulator.properties
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_LAZY_INIT: "true"
      ONTOP_WAIT_FOR: "postgres:5432"
      ONTOP_WAIT_TIMEOUT: "120"
    volumes:
      - ./obda:/opt/ontop/input
      - ..:/opt/ontop/ontology:ro
      - ./jdbc:/opt/ontop/jdbc
    ports:
      - "8080:8080"
    depends_on:
      - postgres
