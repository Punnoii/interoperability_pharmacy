server:
  port: 8082

spring:
  jackson:
    serialization:
      indent_output: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 250MB
      file-size-threshold: 2MB

ontop:
  endpoint: ${ONTOP_ENDPOINT:http://localhost:8080/sparql}
  default-accept: application/sparql-results+json

trino:
  jdbc-url: ${TRINO_JDBC_URL:jdbc:trino://localhost:8090}
  user: ${TRINO_USER:mapping-assistant}
