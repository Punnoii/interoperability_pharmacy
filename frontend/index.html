<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMP SPARQL Frontend Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f5f9;
      --card: #ffffff;
      --text: #10243f;
      --muted: #4d607a;
      --accent: #0a66c2;
      --accent-hover: #084d93;
      --border: #d4dde8;
      --ok: #0f7b0f;
      --error: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f7faff 0%, var(--bg) 100%);
    }

    .container {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(28, 58, 102, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      background: #fff;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      line-height: 1.45;
      resize: vertical;
      margin-bottom: 10px;
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      color: #fff;
      background: var(--accent);
    }

    .primary:hover {
      background: var(--accent-hover);
    }

    .secondary {
      color: var(--text);
      background: #eef4fb;
      border-color: #c8d9ee;
    }

    .status {
      min-height: 22px;
      margin: 6px 0 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .status.ok {
      color: var(--ok);
    }

    .status.error {
      color: var(--error);
    }

    pre {
      background: #0e1b2f;
      color: #deebff;
      border-radius: 10px;
      padding: 14px;
      overflow: auto;
      min-height: 220px;
      margin: 0;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    .note {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 880px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>IDMP SPARQL Frontend Demo</h1>
      <p>Enter SPARQL and call backend API to view raw result text (including RDF response).</p>

      <div class="controls">
        <label>
          Backend API URL
          <input id="apiUrl" value="http://localhost:8082/api/sparql">
        </label>
        <label>
          Endpoint
          <select id="endpoint">
            <option value="default">default (8080)</option>
            <option value="mysql">mysql (8081)</option>
          </select>
        </label>
        <label>
          Response format
          <select id="accept">
            <option value="text/turtle">RDF Turtle (text/turtle)</option>
            <option value="application/rdf+xml">RDF XML (application/rdf+xml)</option>
            <option value="application/ld+json">RDF JSON-LD (application/ld+json)</option>
            <option value="application/sparql-results+json">SPARQL JSON (for SELECT)</option>
            <option value="text/csv">SPARQL CSV (for SELECT)</option>
          </select>
        </label>
      </div>

      <textarea id="query" spellcheck="false"></textarea>

      <div class="actions">
        <button class="primary" id="runBtn">Run Query</button>
        <button class="secondary" id="rdfSampleBtn">Use RDF Sample (CONSTRUCT)</button>
        <button class="secondary" id="selectSampleBtn">Use SELECT Sample</button>
      </div>

      <div id="status" class="status"></div>
      <pre id="result"></pre>
      <div class="note">Use CONSTRUCT or DESCRIBE if you need RDF output.</div>
    </section>
  </main>

  <script>
    const queryInput = document.getElementById("query");
    const apiUrlInput = document.getElementById("apiUrl");
    const endpointInput = document.getElementById("endpoint");
    const acceptInput = document.getElementById("accept");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const runBtn = document.getElementById("runBtn");
    const rdfSampleBtn = document.getElementById("rdfSampleBtn");
    const selectSampleBtn = document.getElementById("selectSampleBtn");

    const RDF_SAMPLE_QUERY = `CONSTRUCT {
  ?s ?p ?o .
}
WHERE {
  ?s ?p ?o .
}
LIMIT 50`;

    const SELECT_SAMPLE_QUERY = `SELECT ?s ?p ?o
WHERE {
  ?s ?p ?o .
}
LIMIT 25`;

    queryInput.value = RDF_SAMPLE_QUERY;

    rdfSampleBtn.addEventListener("click", () => {
      queryInput.value = RDF_SAMPLE_QUERY;
      if (acceptInput.value.startsWith("application/sparql-results")) {
        acceptInput.value = "text/turtle";
      }
    });

    selectSampleBtn.addEventListener("click", () => {
      queryInput.value = SELECT_SAMPLE_QUERY;
      if (!(acceptInput.value.includes("sparql-results") || acceptInput.value === "text/csv")) {
        acceptInput.value = "application/sparql-results+json";
      }
    });

    runBtn.addEventListener("click", runQuery);

    async function runQuery() {
      const query = queryInput.value.trim();
      const apiUrl = apiUrlInput.value.trim();
      if (!query) {
        renderStatus("Query is empty", true);
        resultEl.textContent = "";
        return;
      }
      if (!apiUrl) {
        renderStatus("Backend API URL is empty", true);
        resultEl.textContent = "";
        return;
      }

      renderStatus("Running query...", false);
      runBtn.disabled = true;

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            endpoint: endpointInput.value,
            accept: acceptInput.value
          })
        });

        const contentType = response.headers.get("content-type") || "unknown";
        const bodyText = await response.text();

        if (!response.ok) {
          renderStatus(`HTTP ${response.status} ${response.statusText} (${contentType})`, true);
          resultEl.textContent = bodyText || "No response body";
          return;
        }

        renderStatus(`HTTP ${response.status} (${contentType})`, false, true);
        resultEl.textContent = formatResponseBody(bodyText, contentType);
      } catch (error) {
        renderStatus("Request failed: " + error.message, true);
        resultEl.textContent = "";
      } finally {
        runBtn.disabled = false;
      }
    }

    function formatResponseBody(bodyText, contentType) {
      if (contentType.includes("json")) {
        try {
          return JSON.stringify(JSON.parse(bodyText), null, 2);
        } catch (_) {
          return bodyText;
        }
      }
      return bodyText;
    }

    function renderStatus(message, isError, isSuccess) {
      statusEl.textContent = message;
      statusEl.classList.remove("error", "ok");
      if (isError) {
        statusEl.classList.add("error");
      } else if (isSuccess) {
        statusEl.classList.add("ok");
      }
    }
  </script>
</body>
</html>
