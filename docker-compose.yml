services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: company_d
    ports:
      - "27017:27017"
    volumes:
      - ./infra/db/mongo:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - ./infra/db/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpass"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pgpass
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres-csv-loader:
    image: postgres:16
    environment:
      PGPASSWORD: pgpass
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/db/postgres_csv:/work/sql:ro
      - ./infra/db/csv:/work/csv:ro
    command: >
      sh -c "
        until pg_isready -h postgres -U postgres -d postgres; do sleep 2; done &&
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d postgres -f /work/sql/003_company_e_raw.sql &&
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d postgres -f /work/sql/004_company_e_load.sql
      "

  trino:
    image: trinodb/trino:479
    ports:
      - "8090:8080"
    volumes:
      - ./infra/trino/etc/catalog:/etc/trino/catalog
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ontop-trino:
    image: ontop/ontop:5.3.1
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/idmp-entry-iso11238-core-lcc.rdf
      ONTOP_MAPPING_FILE: /opt/ontop/input/iso11238-trino.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/regulator-trino.properties
      ONTOP_XML_CATALOG_FILE: /opt/ontop/ontology/catalog-v001.xml
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_LAZY_INIT: "true"
      ONTOP_WAIT_FOR: "trino:8080"
      ONTOP_WAIT_TIMEOUT: "120"
    volumes:
      - ./infra/ontop/obda:/opt/ontop/input
      - ./infra/ontop/idmp/ontology/master/v1.3.0:/opt/ontop/ontology:ro
      - ./infra/ontop/jdbc:/opt/ontop/jdbc
    ports:
      - "8083:8080"
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
    ports:
      - "8082:8082"
    environment:
      ONTOP_ENDPOINT: http://ontop-trino:8080/sparql
    depends_on:
      ontop-trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8082
    depends_on:
      backend:
        condition: service_healthy

