services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - ./sql/mysql:/docker-entrypoint-initdb.d
    networks:
      - app-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pgpass
    ports:
      - "5432:5432"
    volumes:
      - ./sql/postgres:/docker-entrypoint-initdb.d
    networks:
      - app-network

  trino:
    image: trinodb/trino:479
    ports:
      - "8090:8080"
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog
    depends_on:
      - mysql
      - postgres
    networks:
      - app-network

  ontop:
    image: ontop/ontop:5.3.1
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/idmp-entry-iso11238-core-lcc.rdf
      ONTOP_MAPPING_FILE: /opt/ontop/input/iso11238.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/regulator.properties
      ONTOP_XML_CATALOG_FILE: /opt/ontop/ontology/catalog-v001.xml
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_LAZY_INIT: "true"
      ONTOP_WAIT_FOR: "postgres:5432"
      ONTOP_WAIT_TIMEOUT: "120"
    volumes:
      - ./obda:/opt/ontop/input
      - ./idmp/ontology/master/v1.3.0:/opt/ontop/ontology:ro
      - ./jdbc:/opt/ontop/jdbc
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - app-network

  ontop-mysql:
    image: ontop/ontop:5.3.1
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/idmp-entry-iso11238-core-lcc.rdf
      ONTOP_MAPPING_FILE: /opt/ontop/input/iso11238-mysql.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/regulator-mysql.properties
      ONTOP_XML_CATALOG_FILE: /opt/ontop/ontology/catalog-v001.xml
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_LAZY_INIT: "true"
      ONTOP_WAIT_FOR: "mysql:3306"
      ONTOP_WAIT_TIMEOUT: "120"
    volumes:
      - ./obda:/opt/ontop/input
      - ./idmp/ontology/master/v1.3.0:/opt/ontop/ontology:ro
      - ./jdbc:/opt/ontop/jdbc
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      ONTOP_ENDPOINT_DEFAULT: http://ontop:8080/sparql
      ONTOP_ENDPOINT_MYSQL: http://ontop-mysql:8080/sparql
    depends_on:
      - postgres
      - mysql
      - ontop
      - ontop-mysql
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Used server-side by app/api/sparql/route.ts to reach the backend
      # over the internal docker network.
      NEXT_PUBLIC_API_URL: http://backend:8082
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
