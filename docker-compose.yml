services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pgpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # NDC text file
  fda-ndc-loader:
    image: postgres:16
    profiles: ["loader"]
    environment:
      PGPASSWORD: pgpass
      PGCLIENTENCODING: WIN1252
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/fda-ndc-raw:/data/fda-ndc-raw:ro
      - ./infra/db/fda_ndc:/work:ro
    command: ["sh", "/work/load_raw_product.sh"]

  gsrs-loader:
    build:
      context: ./infra/db/fda_ndc/json
    profiles: ["loader"]
    environment:
      PGPASSWORD: pgpass
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/GSRS:/data/GSRS:ro
      - ./infra/db/gsrs:/work:ro
    command: ["sh", "/work/load-raw-gsrs.sh"]

  # NDC JSON file
  openfda-ndc-json-loader:
    build:
      context: ./infra/db/fda_ndc/json
    profiles: ["loader"]
    environment:
      PGPASSWORD: pgpass
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/fda-ndc:/data/fda-ndc:ro
      - ./infra/db/fda_ndc/json:/work:ro
    command: ["sh", "/work/load_raw_openfda_json.sh"]

  trino:
    image: trinodb/trino:479
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./infra/trino/etc/catalog:/etc/trino/catalog
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ontop-trino:
    image: ontop/ontop:5.3.1
    restart: unless-stopped
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/idmp-core-entry.rdf
      ONTOP_MAPPING_FILE: /opt/ontop/input/ontop-mapping.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/regulator-trino.properties
      ONTOP_XML_CATALOG_FILE: /opt/ontop/ontology/catalog-v001.xml
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_LAZY_INIT: "true"
      ONTOP_WAIT_FOR: "trino:8080"
      ONTOP_WAIT_TIMEOUT: "120"
    volumes:
      - ./infra/ontop/obda:/opt/ontop/input
      - ./infra/ontop/idmp/ontology/master/v1.3.0:/opt/ontop/ontology:ro
      - ./infra/ontop/jdbc:/opt/ontop/jdbc
    ports:
      - "8083:8080"
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      ONTOP_ENDPOINT: http://ontop-trino:8080/sparql
      TRINO_JDBC_URL: jdbc:trino://trino:8080
      TRINO_USER: mapping-assistant
    volumes:
      - ./backend:/app
      - backend-m2:/root/.m2
    depends_on:
      ontop-trino:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8082
      - DATABASE_URL=postgresql://postgres:pgpass@postgres:5432/postgres?schema=public
      - JWT_SECRET=rxvkg-dev-secret-change-in-production
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  backend-m2:
